blueprint:
  name: Reiseverlauf – Push-Nachricht
  description: >-
    Schickt eine Push-Nachricht an die Companion-App, wenn eine Reise endet: mit Titel, Strecke, Fahrzeit und
    Abfahrt/Ankunft. Tippen auf die Nachricht öffnet eine Dashboard-Ansicht, z. B. mit dem Gesamtbild. Endet eine
    fortgesetzte Reise, ersetzt die neue Nachricht die alte. Optional auch bei Reisebeginn, nach einem
    manuellen Export und wenn eine Tour erstellt oder (z. B. nach nachgetragener Maut) aktualisiert wurde.
  domain: automation
  author: ChrisFerro
  homeassistant:
    min_version: "2026.8.0"
  source_url: https://github.com/ChrisFerro/ha-reiseverlauf/blob/main/blueprints/automation/reiseverlauftracker/benachrichtigung.yaml
  input:
    allgemein:
      name: Fahrzeug und Empfänger
      icon: mdi:rv-truck
      input:
        fahrzeug:
          name: Fahrzeug
          description: Der Eintrag der Reiseaufzeichnung, dessen Reisen gemeldet werden.
          selector:
            config_entry:
              integration: reiseverlauftracker
        geraete:
          name: Empfänger
          description: Handys mit der Home-Assistant-Companion-App, die die Nachricht bekommen.
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
    anlaesse:
      name: Wann melden
      icon: mdi:bell-cog
      input:
        bei_start:
          name: Bei Reisebeginn
          description: Auch melden, wenn eine Reise beginnt. Eine fortgesetzte Reise wird nicht gemeldet.
          default: true
          selector:
            boolean:
        bei_export:
          name: Nach manuellem Export
          description: Auch melden, wenn ein Export über die Aktion „Zeitraum exportieren“ fertig ist.
          default: false
          selector:
            boolean:
        bei_tour_erstellt:
          name: Tour erstellt
          description: Melden, wenn eine Tour aus mehreren Reisen erstellt wurde.
          default: true
          selector:
            boolean:
        bei_tour_aktualisiert:
          name: Tour aktualisiert
          description: >-
            Melden, wenn eine Tour neu erstellt wurde, z. B. nach nachgetragener Maut oder geändertem Titel.
          default: false
          selector:
            boolean:
        dashboard:
          name: Ansicht beim Tippen
          description: >-
            Pfad der Dashboard-Ansicht, die sich beim Tippen auf die Nachricht öffnet, z. B.
            /dashboard-reiseverlauf/letzte-reise. Leer lassen, damit Tippen nur die App öffnet.
          default: /dashboard-reiseverlauf
          selector:
            text:
    texte:
      name: Überschriften
      icon: mdi:format-title
      collapsed: true
      input:
        titel_ende:
          name: Bei Reiseende
          default: Reise beendet
          selector:
            text:
        titel_aktualisiert:
          name: Bei fortgesetzter Reise
          default: Reise aktualisiert
          selector:
            text:
        titel_start:
          name: Bei Reisebeginn
          default: Reise gestartet
          selector:
            text:
        titel_export:
          name: Nach manuellem Export
          default: Export fertig
          selector:
            text:
        titel_tour:
          name: Tour erstellt
          default: Tour fertig
          selector:
            text:
        titel_tour_aktualisiert:
          name: Tour aktualisiert
          default: Tour aktualisiert
          selector:
            text:

mode: queued
max_exceeded: silent

triggers:
  - trigger: event
    event_type: reiseverlauftracker_beendet
    event_data:
      entry_id: !input fahrzeug
    id: beendet
  - trigger: event
    event_type: reiseverlauftracker_gestartet
    event_data:
      entry_id: !input fahrzeug
      resumed: false
    id: gestartet
    enabled: !input bei_start
  - trigger: event
    event_type: reiseverlauftracker_exportiert
    event_data:
      entry_id: !input fahrzeug
    id: exportiert
    enabled: !input bei_export
  - trigger: event
    event_type: reiseverlauftracker_tour
    event_data:
      entry_id: !input fahrzeug
      anlass: erstellt
    id: tour
    enabled: !input bei_tour_erstellt
  - trigger: event
    event_type: reiseverlauftracker_tour
    event_data:
      entry_id: !input fahrzeug
      anlass: aktualisiert
    id: tour_aktualisiert
    enabled: !input bei_tour_aktualisiert

variables:
  geraete: !input geraete
  dashboard: !input dashboard
  titel_ende: !input titel_ende
  titel_aktualisiert: !input titel_aktualisiert
  titel_start: !input titel_start
  titel_export: !input titel_export
  titel_tour: !input titel_tour
  titel_tour_aktualisiert: !input titel_tour_aktualisiert
  daten: "{{ trigger.event.data }}"
  ueberschrift: >-
    {% if trigger.id == 'gestartet' %}{{ titel_start }}
    {% elif trigger.id == 'exportiert' %}{{ titel_export }}: {{ daten.titel }}
    {% elif trigger.id == 'tour' %}{{ titel_tour }}: {{ daten.titel }}
    {% elif trigger.id == 'tour_aktualisiert' %}{{ titel_tour_aktualisiert }}: {{ daten.titel }}
    {% elif daten.fortgesetzt %}{{ titel_aktualisiert }}: {{ daten.titel }}
    {% else %}{{ titel_ende }}: {{ daten.titel }}{% endif %}
  nachricht: >-
    {% if trigger.id == 'gestartet' %}
      {% if daten.startort is defined and daten.startort %}in {{ daten.startort }} {% endif -%}
      um {{ as_local(as_datetime(daten.start)).strftime('%H:%M') }} Uhr
    {% elif trigger.id in ['tour', 'tour_aktualisiert'] %}
      {% set start = as_local(as_datetime(daten.start)) %}
      {% set ende = as_local(as_datetime(daten.ende)) %}
      {% set naechte = '1 Nacht' if daten.naechte == 1 else daten.naechte ~ ' Nächte' %}
      {{ start.strftime('%d.%m.') }}–{{ ende.strftime('%d.%m.%Y') }} · {{ '%.0f' | format(daten.strecke_km) }} km · {{ naechte }}
      {%- if daten.kosten %} · Kosten {{ ('%.2f' | format(daten.kosten)) | replace('.', ',') }} €{% endif %}
    {% else %}
      {% set start = as_local(as_datetime(daten.abfahrt | default(daten.start))) %}
      {% set ende = as_local(as_datetime(daten.ankunft | default(daten.ende))) %}
      {% set strecke = '%.1f' | format(daten.strecke_km) | replace('.', ',') %}
      {% set fahrzeit = '%d h %02d min' | format(daten.fahrzeit_min // 60, daten.fahrzeit_min % 60) %}
      {% if start.date() == ende.date() %}
        {% set zeit = start.strftime('%H:%M') ~ '–' ~ ende.strftime('%H:%M') ~ ' Uhr' %}
      {% else %}
        {% set zeit = start.strftime('%d.%m. %H:%M') ~ ' – ' ~ ende.strftime('%d.%m. %H:%M') ~ ' Uhr' %}
      {% endif %}
      {{ strecke }} km · {{ fahrzeit }} Fahrzeit · {{ zeit }}
    {% endif %}
  zusatz: >-
    {% set d = {'tag': 'reiseverlauf_' ~ (daten.ordner if daten.ordner is defined else 'start')} %}
    {% if dashboard %}
      {% set d = dict(d, clickAction=dashboard, url=dashboard) %}
    {% endif %}
    {{ d }}

actions:
  - repeat:
      for_each: "{{ geraete }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            title: "{{ ueberschrift }}"
            message: "{{ nachricht }}"
            data: "{{ zusatz }}"
